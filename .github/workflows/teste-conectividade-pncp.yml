name: Teste de conectividade com o PNCP

# Workflow temporário, só pra verificar se o GitHub Actions consegue
# alcançar a API do PNCP (o Render não consegue — bloqueio de IP). Disparo
# manual (workflow_dispatch), não roda automaticamente em push/PR.
on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar conexão com pncp.gov.br
        run: |
          echo "IP de saída deste runner:"
          curl -s https://api.ipify.org || true
          echo ""
          echo "---"
          echo "Testando PNCP..."
          curl -sS -o /dev/null -w "HTTP %{http_code} — tempo total: %{time_total}s\n" \
            --max-time 30 \
            "https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal=20261127&codigoModalidadeContratacao=6&pagina=1&tamanhoPagina=1"
